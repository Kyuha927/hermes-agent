# python examples/harnesses/gemini-31-pro-high/render_harness.py examples/harnesses/gemini-31-pro-high/task-card.yaml

# This task card is for a standalone Gemini 3.1 Pro High harness.
# The model must design, evidence-check, self-critique, trim, and finalize by itself.

goal: >
  Design a creative system with Opus-like discipline: preserve user intent, avoid over-design, avoid unsupported leaps, and produce a small testable final plan.

current_context: >
  Summarize only the relevant project context here. Avoid past conversation sprawl. Include only current goals, constraints, existing decisions, failures, and success criteria.

invariants:
  - Preserve the user's actual intent.
  - Do not change existing core decisions without explicit permission.
  - Do not add unrequested features.
  - Prefer the smallest MVP that can be tested.
  - Separate facts, assumptions, hypotheses, and UNKNOWNs.
  - If context conflicts, prioritize the latest explicit user goal.
  - Do not promote a hypothesis into a final reason unless it is validated or explicitly accepted as a risk.

non_goals:
  - Do not implement code in this step.
  - Do not delegate judgment to another model.
  - Do not produce only brainstorming options.
  - Do not introduce a new architecture unless the current one cannot satisfy the goal.
  - Do not optimize for impressiveness over usability.
  - Do not invent missing context.

existing_decisions:
  - Gemini 3.1 Pro High must be used as a standalone design harness.
  - The harness should emulate Opus-like intent preservation, reductive editing, evidence control, and final design judgment as much as possible.
  - External models may execute later, but this harness must produce a complete design decision on its own.

known_facts:
  - Gemini Pro High is creative and strong at expansion.
  - Gemini Pro High can drift or make unsupported inferential leaps when prompts are loose.
  - The harness must force evidence labeling before final decisions.

pain_point: >
  Gemini Pro High is highly creative but may drift, over-expand, or hallucinate via unsupported inference when the prompt is loose or the context grows long.

desired_output: >
  Intent lock, context pruning, evidence map, three design candidates, self-critique, reductive edit, one final MVP design, drift/evidence check, and an implementation handoff under 1000 characters.
